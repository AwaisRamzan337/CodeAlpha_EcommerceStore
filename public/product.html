<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — MyStore</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>

    <nav class="navbar">
        <h2>👑 MyStore</h2>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/wishlist">❤️ Wishlist</a>
            <a href="/orders">📦 Orders</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">

        <button onclick="window.location.href='/'"
            style="background:transparent; border:1px solid var(--border);
            color:var(--muted); padding:10px 20px; border-radius:4px;
            cursor:pointer; margin-bottom:30px; font-size:14px; transition:all 0.3s"
            onmouseover="this.style.borderColor='var(--gold)';this.style.color='var(--gold)'"
            onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
            ← Back to Shop
        </button>

        <div class="product-detail-grid" id="productDetail">

            <div class="product-detail-left">
                <div class="product-detail-img" id="productImg"></div>
                <div style="margin-top:30px">
                    <h3 style="font-family:'Poppins',sans-serif; color:var(--text);
                    margin-bottom:15px; font-size:16px; letter-spacing:1px;
                    text-transform:uppercase">Related Products</h3>
                    <div id="relatedProducts"
                        style="display:grid; grid-template-columns:repeat(2,1fr); gap:15px">
                    </div>
                </div>
            </div>

            <div class="product-detail-right">
                <div id="productInfo">
                    <div class="skeleton skeleton-title" style="width:60%; height:30px; margin-bottom:15px"></div>
                    <div class="skeleton skeleton-text" style="width:40%; height:20px; margin-bottom:20px"></div>
                    <div class="skeleton skeleton-text" style="width:90%; height:15px; margin-bottom:10px"></div>
                    <div class="skeleton skeleton-text" style="width:80%; height:15px; margin-bottom:30px"></div>
                    <div class="skeleton skeleton-btn" style="height:50px"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <div class="footer-bottom" style="border-top:none; padding-top:0">
            <p>© 2026 MyStore. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const pathParts = window.location.pathname.split('/');
        const productId = pathParts[pathParts.length - 1];
        let quantity = 1;
        let currentProduct = null;

        async function loadProduct() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const product = products.find(p => p.id == productId);

            if (!product) {
                document.getElementById('productDetail').innerHTML =
                    '<p style="color:var(--muted)">Product not found!</p>';
                return;
            }

            currentProduct = product;
            document.title = `${product.name} — MyStore`;

            const wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
            const inWishlist = wishlist.findIndex(w => w.id === product.id) !== -1;

            document.getElementById('productImg').innerHTML = `
                <div style="font-size:150px; text-align:center;
                padding:40px; background:var(--card);
                border:1px solid var(--border); border-radius:12px;
                transition:transform 0.3s; cursor:default"
                onmouseover="this.style.transform='scale(1.05)'"
                onmouseout="this.style.transform='scale(1)'">
                    ${product.image}
                </div>
            `;

            document.getElementById('productInfo').innerHTML = `
                <span style="color:var(--gold); font-size:12px;
                letter-spacing:2px; text-transform:uppercase;
                font-weight:600">${product.category}</span>

                <h1 style="font-family:'Poppins',sans-serif; font-size:36px;
                font-weight:700; margin:12px 0; color:var(--text)">
                    ${product.name}
                </h1>

                <div style="color:var(--gold); font-size:18px; margin-bottom:10px">
                    ⭐⭐⭐⭐⭐
                    <span style="color:var(--muted); font-size:13px; margin-left:8px">
                        (128 reviews)
                    </span>
                </div>

                <div style="font-family:'Poppins',sans-serif; font-size:42px;
                font-weight:800; color:var(--gold); margin:15px 0">
                    $${product.price}
                </div>

                <div style="background:var(--card); border:1px solid var(--border);
                border-radius:8px; padding:20px; margin-bottom:25px">
                    <p style="color:var(--muted); font-size:15px; line-height:1.8">
                        ${product.description}. Premium quality product with excellent
                        craftsmanship. Designed for those who appreciate the finer
                        things in life. Comes with full warranty and premium packaging.
                    </p>
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:25px">
                    <div style="background:rgba(212,175,55,0.1); border:1px solid var(--border);
                    border-radius:6px; padding:10px 16px; font-size:13px; color:var(--gold)">
                        ✅ Free Delivery
                    </div>
                    <div style="background:rgba(212,175,55,0.1); border:1px solid var(--border);
                    border-radius:6px; padding:10px 16px; font-size:13px; color:var(--gold)">
                        🔄 Easy Returns
                    </div>
                    <div style="background:rgba(212,175,55,0.1); border:1px solid var(--border);
                    border-radius:6px; padding:10px 16px; font-size:13px; color:var(--gold)">
                        🛡️ 1 Year Warranty
                    </div>
                </div>

                <p style="color:var(--success); font-size:14px;
                margin-bottom:20px; font-weight:500">
                    ● In Stock — Ready to Ship
                </p>

                <div style="display:flex; align-items:center; gap:15px; margin-bottom:25px">
                    <span style="color:var(--muted); font-size:14px">Quantity:</span>
                    <div style="display:flex; align-items:center;
                    border:1px solid var(--border); border-radius:4px; overflow:hidden">
                        <button onclick="changeQty(-1)"
                            style="background:var(--card); border:none;
                            color:var(--gold); padding:10px 18px;
                            cursor:pointer; font-size:18px">−</button>
                        <span id="qtyDisplay"
                            style="padding:10px 20px; background:var(--bg);
                            color:var(--text); font-weight:600">1</span>
                        <button onclick="changeQty(1)"
                            style="background:var(--card); border:none;
                            color:var(--gold); padding:10px 18px;
                            cursor:pointer; font-size:18px">+</button>
                    </div>
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px">
                    <button onclick="addToCart('${product.name}', ${product.price})"
                        class="btn-order" style="flex:1; min-width:150px">
                        🛒 Add to Cart
                    </button>
                    <button onclick="buyNow('${product.name}', ${product.price})"
                        style="flex:1; min-width:150px; padding:16px;
                        background:transparent; border:1px solid var(--gold);
                        color:var(--gold); border-radius:4px; cursor:pointer;
                        font-size:15px; font-weight:700; letter-spacing:1px;
                        text-transform:uppercase; transition:all 0.3s;
                        font-family:'Poppins',sans-serif"
                        onmouseover="this.style.background='var(--gold)';this.style.color='#000'"
                        onmouseout="this.style.background='transparent';this.style.color='var(--gold)'">
                        ⚡ Buy Now
                    </button>
                </div>

                <button id="wishlistBtn" onclick="toggleWishlist()"
                    style="width:100%; padding:14px;
                    background:${inWishlist ? 'rgba(212,175,55,0.1)' : 'transparent'};
                    border:1px solid ${inWishlist ? 'var(--gold)' : 'var(--border)'};
                    color:${inWishlist ? 'var(--gold)' : 'var(--muted)'};
                    border-radius:4px; cursor:pointer; font-size:14px;
                    font-weight:600; letter-spacing:1px; text-transform:uppercase;
                    transition:all 0.3s; font-family:'Poppins',sans-serif">
                    ${inWishlist ? '❤️ Wishlisted' : '🤍 Add to Wishlist'}
                </button>
            `;

            const related = products
                .filter(p => p.category === product.category && p.id != productId)
                .slice(0, 4);

            document.getElementById('relatedProducts').innerHTML =
                related.length === 0
                ? '<p style="color:var(--muted); font-size:13px">No related products.</p>'
                : related.map(p => `
                    <div onclick="window.location.href='/product/${p.id}'"
                        style="background:var(--card); border:1px solid var(--border);
                        border-radius:8px; padding:15px; text-align:center;
                        cursor:pointer; transition:all 0.3s"
                        onmouseover="this.style.borderColor='var(--gold)';this.style.transform='translateY(-3px)'"
                        onmouseout="this.style.borderColor='var(--border)';this.style.transform='translateY(0)'">
                        <div style="font-size:35px; margin-bottom:8px">${p.image}</div>
                        <div style="font-size:13px; font-weight:600;
                        color:var(--text); margin-bottom:4px">${p.name}</div>
                        <div style="color:var(--gold); font-weight:700;
                        font-family:'Poppins',sans-serif">$${p.price}</div>
                    </div>
                `).join('');
        }

        function toggleWishlist() {
            const product = currentProduct;
            let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
            const index = wishlist.findIndex(w => w.id === product.id);
            const btn = document.getElementById('wishlistBtn');

            if (index === -1) {
                wishlist.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    description: product.description
                });
                btn.textContent = '❤️ Wishlisted';
                btn.style.borderColor = 'var(--gold)';
                btn.style.color = 'var(--gold)';
                btn.style.background = 'rgba(212,175,55,0.1)';
                showToast(`❤️ ${product.name} added to wishlist!`, 'success');
            } else {
                wishlist.splice(index, 1);
                btn.textContent = '🤍 Add to Wishlist';
                btn.style.borderColor = 'var(--border)';
                btn.style.color = 'var(--muted)';
                btn.style.background = 'transparent';
                showToast(`💔 ${product.name} removed from wishlist!`, 'error');
            }
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
        }

        function changeQty(delta) {
            quantity = Math.max(1, quantity + delta);
            document.getElementById('qtyDisplay').textContent = quantity;
        }

        function addToCart(name, price) {
            const cart = JSON.parse(localStorage.getItem('checkoutCart') || '[]');
            for (let i = 0; i < quantity; i++) cart.push({ name, price });
            localStorage.setItem('checkoutCart', JSON.stringify(cart));
            showToast(`✅ ${quantity}x ${name} added to cart!`, 'success');
        }

        function buyNow(name, price) {
            const cart = [];
            for (let i = 0; i < quantity; i++) cart.push({ name, price });
            localStorage.setItem('checkoutCart', JSON.stringify(cart));
            window.location.href = '/checkout';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        loadProduct();
    </script>
</body>
</html>
