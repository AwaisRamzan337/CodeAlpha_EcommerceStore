<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — MyStore</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>

    <nav class="navbar">
        <h2>👑 MyStore</h2>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/orders">📦 Orders</a>
            <a href="/wishlist">❤️ Wishlist</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">

        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-info">
                <h2 id="profileName">Loading...</h2>
                <p id="profileRole">Member</p>
                <span class="profile-badge">✅ Verified Account</span>
            </div>
        </div>

        <div class="stats-grid" style="margin-bottom:30px">
            <div class="stat-card">
                <div class="stat-num" id="statOrders">0</div>
                <p>Total Orders</p>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statSpent">$0</div>
                <p>Total Spent</p>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statWishlist">0</div>
                <p>Wishlist Items</p>
            </div>
            <div class="stat-card">
                <div class="stat-num">⭐</div>
                <p>Premium Member</p>
            </div>
        </div>

        <div class="profile-tabs">
            <button class="profile-tab active" onclick="showTab('orders', this)">📦 My Orders</button>
            <button class="profile-tab" onclick="showTab('wishlist', this)">❤️ Wishlist</button>
            <button class="profile-tab" onclick="showTab('settings', this)">⚙️ Settings</button>
        </div>

        <div id="tab-orders" class="tab-content">
            <div id="profileOrders">
                <div style="text-align:center; padding:40px; color:var(--muted)">
                    <div style="font-size:40px">⏳</div>
                    <p style="margin-top:10px">Loading orders...</p>
                </div>
            </div>
        </div>

        <div id="tab-wishlist" class="tab-content" style="display:none">
            <div id="profileWishlist"></div>
        </div>

        <div id="tab-settings" class="tab-content" style="display:none">
            <div style="background:var(--card); border:1px solid var(--border);
            border-radius:8px; padding:30px; max-width:500px">
                <h3 style="font-family:'Poppins',sans-serif; margin-bottom:20px; color:var(--text)">
                    Account Settings
                </h3>

                <label style="color:var(--muted); font-size:13px; letter-spacing:1px; text-transform:uppercase">
                    Username
                </label>
                <input type="text" id="settingUsername"
                    style="width:100%; padding:13px; background:var(--bg);
                    border:1px solid var(--border); border-radius:4px;
                    color:var(--text); font-size:14px; margin:8px 0 16px; outline:none" readonly />

                <label style="color:var(--muted); font-size:13px; letter-spacing:1px; text-transform:uppercase">
                    Member Since
                </label>
                <input type="text" value="May 2026"
                    style="width:100%; padding:13px; background:var(--bg);
                    border:1px solid var(--border); border-radius:4px;
                    color:var(--text); font-size:14px; margin:8px 0 16px; outline:none" readonly />

                <label style="color:var(--muted); font-size:13px; letter-spacing:1px; text-transform:uppercase">
                    Account Type
                </label>
                <input type="text" id="settingRole"
                    style="width:100%; padding:13px; background:var(--bg);
                    border:1px solid var(--border); border-radius:4px;
                    color:var(--gold); font-size:14px; margin:8px 0 25px;
                    outline:none; font-weight:600" readonly />

                <button onclick="window.location.href='/logout'"
                    style="width:100%; padding:14px; background:rgba(239,68,68,0.1);
                    border:1px solid rgba(239,68,68,0.3); color:#EF4444;
                    border-radius:4px; cursor:pointer; font-size:14px;
                    font-weight:600; letter-spacing:1px; transition:all 0.3s"
                    onmouseover="this.style.background='#EF4444';this.style.color='white'"
                    onmouseout="this.style.background='rgba(239,68,68,0.1)';this.style.color='#EF4444'">
                    🚪 Logout
                </button>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <div class="footer-bottom" style="border-top:none; padding-top:0">
            <p>© 2026 MyStore. All rights reserved.</p>
        </div>
    </footer>

    <script>
        async function loadProfile() {
            const res = await fetch('/me');
            const data = await res.json();

            if (!data.loggedIn) {
                window.location.href = '/login';
                return;
            }

            const initials = data.username.substring(0, 2).toUpperCase();
            document.getElementById('profileAvatar').textContent = initials;
            document.getElementById('profileName').textContent = data.username;
            document.getElementById('profileRole').textContent =
                data.role === 'admin' ? '👑 Admin' : '👤 Member';
            document.getElementById('settingUsername').value = data.username;
            document.getElementById('settingRole').value =
                data.role === 'admin' ? '👑 Admin Account' : '👤 Regular Member';

            await loadOrders();
            loadWishlist();
        }

        async function loadOrders() {
            const res = await fetch('/api/orders');
            const orders = await res.json();

            document.getElementById('statOrders').textContent = orders.length;
            const spent = orders.reduce((s, o) => s + o.total, 0);
            document.getElementById('statSpent').textContent = `$${spent}`;

            const div = document.getElementById('profileOrders');

            if (orders.length === 0) {
                div.innerHTML = `
                    <div style="text-align:center; padding:60px; color:var(--muted)">
                        <div style="font-size:50px">📦</div>
                        <h3 style="margin-top:15px; font-family:'Poppins',sans-serif">No orders yet!</h3>
                        <a href="/" style="color:var(--gold)">Start Shopping →</a>
                    </div>`;
                return;
            }

            div.innerHTML = orders.map(o => `
                <div class="order-card">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <h3>${o.product_name}</h3>
                        <span style="background:rgba(34,197,94,0.1);
                        border:1px solid rgba(34,197,94,0.3);
                        color:#22C55E; padding:4px 12px;
                        border-radius:20px; font-size:12px">
                            ${o.status || 'Processing'}
                        </span>
                    </div>
                    <p style="margin-top:8px">💰 Amount: <strong style="color:var(--gold)">$${o.total}</strong></p>
                    <p>📅 Date: ${o.date}</p>
                </div>
            `).join('');
        }

        function loadWishlist() {
            const wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
            document.getElementById('statWishlist').textContent = wishlist.length;

            const div = document.getElementById('profileWishlist');

            if (wishlist.length === 0) {
                div.innerHTML = `
                    <div style="text-align:center; padding:60px; color:var(--muted)">
                        <div style="font-size:50px">❤️</div>
                        <h3 style="margin-top:15px; font-family:'Poppins',sans-serif">Wishlist is empty!</h3>
                        <a href="/" style="color:var(--gold)">Discover Products →</a>
                    </div>`;
                return;
            }

            div.innerHTML = `
                <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px">
                    ${wishlist.map(p => `
                        <div onclick="window.location.href='/product/${p.id}'"
                            style="background:var(--card); border:1px solid var(--border);
                            border-radius:8px; padding:20px; text-align:center;
                            transition:all 0.3s; cursor:pointer"
                            onmouseover="this.style.borderColor='var(--gold)'"
                            onmouseout="this.style.borderColor='var(--border)'">
                            <div style="font-size:40px; margin-bottom:10px">${p.image}</div>
                            <h4 style="color:var(--text); font-size:14px; margin-bottom:6px">${p.name}</h4>
                            <div style="color:var(--gold); font-weight:700; font-family:'Poppins',sans-serif">
                                $${p.price}
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        }

        function showTab(name, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${name}`).style.display = 'block';
            el.classList.add('active');
        }

        loadProfile();
    </script>
</body>
</html>
